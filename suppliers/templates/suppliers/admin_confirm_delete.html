{% extends "suppliers/base_admin.html" %}
{% block title %}Удалить {{ type }} — Админ-панель{% endblock %}
{% block heading %}Удаление {% endblock %}
{% block panel_content %}
<div class="card card-body">
    <h2 class="h5 text-danger mb-3">Вы уверены, что хотите удалить {{ type }}?</h2>
    <p class="mb-3">
        <b>{{ name }}</b><br>
        <span class="text-muted">Действие необратимо.</span>
    </p>
    <form method="post" class="d-flex gap-2">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">&#10060; Удалить</button>
        <a href="{% url 'suppliers:admin_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
