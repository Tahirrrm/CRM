{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <link href="{% static 'suppliers/vendor/bootstrap-5.3.3/css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'suppliers/css/theme.css' %}" rel="stylesheet">
</head>
<body>
<div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-11 col-sm-8 col-md-5 col-lg-4">
            <div class="card card-body p-4">
                <h1 class="h4 text-center mb-4">Вход в систему</h1>
                {% if form.errors %}
                    <div class="alert alert-danger mb-3">Неверное имя пользователя или пароль.</div>
                {% endif %}
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label" for="id_username">Имя пользователя</label>
                        {{ form.username }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="id_password">Пароль</label>
                        {{ form.password }}
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Войти</button>
                    <input type="hidden" name="next" value="{{ next|default:'/admin-panel/' }}">
                </form>
                <div class="text-center text-muted small mt-3">CRM: админ-панель или стандартная админка (только суперпользователи)</div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
